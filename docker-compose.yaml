services:
  flask-app:
    build: .
    container_name: flask_resume_chatbot
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production  # Change this for production environment
    volumes:
      - .:/app
    ports:
      - "5050:5050"
    networks:
      - flask_network
    restart: always


networks:
  flask_network:
    driver: bridge

